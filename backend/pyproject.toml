[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "leornian-backend"
version = "0.1.0"
description = "Leornian modular API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4",
  "celery[redis]>=5.5,<6",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
leornian-migrate = "leornian.platform.migrate:main"
leornian-schema = "leornian.entrypoints.export_schema:main"

[tool.hatch.build.targets.wheel]
packages = ["src/leornian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the dedicated Leornian test database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
